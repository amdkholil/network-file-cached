name: network_file_cacher
description: A flutter library to download and cache files in the cache
  directory of the app.
version: 1.1.0
repository: https://github.com/amdkholil/network-file-cached

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=2.5.0"

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
